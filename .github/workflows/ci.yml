name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Fails if public/ and src/assets.ts have drifted apart, or if any
      # assetFile()/staticFile() call points at a file that is not there.
      - run: npm run scan:check
