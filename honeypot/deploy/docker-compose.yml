# docker compose -f deploy/docker-compose.yml up -d     (run from the honeypot/ directory)
services:
  honey-bit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: honey-bit
    restart: unless-stopped
    environment:
      SIEM: "10.0.0.5:514"          # <-- change to your SIEM collector
      SYSLOG_PROTO: "udp"           # udp | tcp
      SYSLOG_FORMAT: "json"         # json | cef
      SENSOR_NAME: "honey-bit-01"
    ports:
      # host port : container port. Change the left side to 22/80/23/21 to
      # expose the real ports (Docker handles the privileged bind).
      - "2222:2222"
      - "8080:8080"
      - "2323:2323"
      - "2121:2121"
    volumes:
      - honey-bit-data:/data
volumes:
  honey-bit-data:
