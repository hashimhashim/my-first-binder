# Enterprise IAM + Aegis SIEM — one command:  docker compose up --build
#
#   IAM platform + UI   -> http://localhost:8010   (sign in, hire/terminate)
#   Aegis SIEM (demo)   -> http://localhost:9500   (watch users appear/disable)
#
# IAM is pre-wired to manage the SIEM: hire someone in the SOC department in
# IAM and their account is provisioned into the SIEM automatically. PostgreSQL
# is persisted in a named volume.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iam_py
    volumes:
      - iam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  siem:
    build: ./siem-demo
    ports:
      - "9500:9500"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      siem:
        condition: service_started
    environment:
      IAM_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/iam_py
      IAM_JWT_SECRET: ${IAM_JWT_SECRET:-dev-only-change-me}
      IAM_CREDENTIAL_KEY: ${IAM_CREDENTIAL_KEY:-dev-credential-key-change-me}
      # Managed SIEM target — the app registers it as an application on seed.
      IAM_SIEM_URL: http://siem:9500
    ports:
      - "8010:8000"

volumes:
  iam_pgdata:
